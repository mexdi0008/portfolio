spring.application.name=portfolio
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Mail (SMTP) - dəyərlər mühit dəyişənlərindən oxunur
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.secret.expiration=1800000
jwt.refresh.expiration=1296000000

# Telegram botları
bot.name=${BOT_NAME:Tendir}
bot.token=${BOT_TOKEN:}
portfolio.bot.name=${PORTFOLIO_BOT_NAME:Portfolio}
portfolio.bot.token=${PORTFOLIO_BOT_TOKEN:}
